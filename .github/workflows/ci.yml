name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  boot:
    # Boots the production Docker image (the runtime that actually deploys)
    # with dummy tokens and checks every plugin loads.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t slackbot-ci .

      - name: Boot compiled bot
        run: |
          docker run --rm \
            -e NODE_ENV=production \
            -e BOT_TOKEN=ci-dummy \
            -e SLACK_APP_TOKEN=ci-dummy \
            -e CLIENT_SIGNING_SECRET=ci-dummy \
            slackbot-ci timeout 60 npm start > boot.log 2>&1 || true

      - name: Check plugins loaded
        run: bash scripts/boot-check.sh boot.log
